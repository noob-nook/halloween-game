<style>

.gs-prize{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:44px;opacity:0;animation:gsfade 1s 5.6s forwards;filter:drop-shadow(0 0 10px #fff)}
.gs-door{position:absolute;top:0;width:50%;height:100%;background:linear-gradient(#262a33,#262a33) 0 24%/100% 10px no-repeat,linear-gradient(#262a33,#262a33) 0 72%/100% 10px no-repeat,repeating-linear-gradient(90deg,#6a4426 0 17px,#4a2e1a 17px 20px);box-shadow:inset 0 0 22px #000b}
.gs-door::after{content:"";position:absolute;top:52%;width:12px;height:12px;border:3px solid #c9a227;border-radius:50%}
.gs-door.l{left:0;transform-origin:0 50%;animation:gsdl 2.6s 4s cubic-bezier(.6,0,.3,1) forwards}
.gs-door.l::after{right:8px}

@keyframes gsdl{to{transform:rotateY(-108deg)}}@keyframes gsdr{to{transform:rotateY(108deg)}}
.gs-lock{position:absolute;left:50%;top:166px;width:34px;height:34px;margin-left:-17px;font-size:30px;line-height:34px;text-align:center;z-index:5;animation:gsout .4s 4s forwards}

@keyframes gsflash{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(7)}}
.gs-key{position:absolute;left:50%;top:20px;margin-left:-24px;font-size:44px;line-height:48px;z-index:7;opacity:0;filter:drop-shadow(0 0 10px #ffd700) drop-shadow(0 0 22px #ffb300);animation:gskey 4.2s .3s ease-in-out forwards}
@keyframes gskey{0%{top:20px;opacity:0;transform:scale(.2) rotate(-30deg)}12%{top:30px;opacity:1;transform:scale(1.6) rotate(0)}24%{top:40px;opacity:1;transform:scale(1.6) rotate(8deg)}36%{top:30px;opacity:1;transform:scale(1.6) rotate(-8deg)}62%{top:152px;opacity:1;transform:scale(1) rotate(0)}66%{top:152px;opacity:1;transform:scale(1) rotate(0)}80%{top:152px;opacity:1;transform:scale(1) rotate(90deg)}95%{top:152px;opacity:0;transform:scale(1) rotate(90deg)}100%{top:152px;opacity:0;transform:scale(1) rotate(90deg)}}
.gs-p{position:absolute;left:50%;top:183px;font-size:22px;opacity:0;z-index:4;animation:gsburst 2.2s ease-out forwards}
@keyframes gsburst{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(360deg) scale(1.1)}}
.gs-caps{position:relative;height:58px;text-align:center;margin-top:10px}

@keyframes gscap{0%{opacity:0}10%{opacity:1}88%{opacity:1}100%{opacity:0}}
@keyframes gsfade{to{opacity:1}}@keyframes gsout{to{opacity:0}}@keyframes gsspin{to{transform:rotate(360deg)}}

@media(max-width:480px){#app,#adm,#lb{padding:10px}.card{padding:14px}}
</style></head><body>
<div class="fog"></div><div id="embers"></div>
<div id="app"></div><div id="lb"></div><div id="adm"></div>
<script>
const CONFIG={
 ORG_NAME:"管理部",
 LB_SHOW_STATS:true,
 SCORE_URL:"https://script.google.com/macros/s/AKfycbxjscktWJ-pBHSPxQxTxfuG0LMiyd1RG7kh50u3pwUMACZLlAF_PEu-GIc4P_mhmsmn7A/exec",
 TIME_BUDGET_MIN:30,
 PASS_WORDS:["or","Treat","Trick"],
 SHUFFLE_STEPS:30,
 HINT_MAX_USES:5,HINT_PENALTY_SEC:20,HINT_AUTO_STEPS:4,HINT_MIN_MOVES:5,
 RESHUFFLE_MAX:5};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let USERS=ld("hw_users",{}),ME=null,P=null,ADMIN=false,view="login",tick=null;
const $=id=>document.getElementById(id);
const svU=()=>sv("hw_users",USERS),save=()=>{USERS[ME]=P;svU()};
const jpost=b=>fetch(CONFIG.SCORE_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b),signal:AbortSignal.timeout(25000)}).then(r=>r.json());
const p2=n=>String(n).padStart(2,"0"),fmt=d=>{d=new Date(d);return`${d.getFullYear()}/${p2(d.getMonth()+1)}/${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`},mmss=s=>`${p2(Math.floor(s/60))} 分 ${p2(Math.floor(s%60))} 秒`;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
for(let i=0;i<14;i++){const e=document.createElement("i");e.className="ember";e.style.left=Math.random()*100+"%";e.style.animationDelay=Math.random()*7+"s";e.style.animationDuration=5+Math.random()*5+"s";$("embers").appendChild(e)}
const FORMS=["白 × 黑 − 灰","（白 + 黑 + 灰）× 2","黑的平方 − （白 × 灰）","（白 + 黑）× 灰 − 白"];
function scr(){let ord=[...Array(16).keys()],pos=15,trail=[15],prev=-1;
 for(let i=0;i<CONFIG.SHUFFLE_STEPS;i++){const r=pos>>2,c=pos&3,n=[];if(r>0)n.push(pos-4);if(r<3)n.push(pos+4);if(c>0)n.push(pos-1);if(c<3)n.push(pos+1);
  const ch=n.filter(x=>x!==prev),q=ch[Math.random()*ch.length|0];ord[pos]=ord[q];ord[q]=15;prev=pos;pos=q;
  if(trail.length>1&&trail[trail.length-2]===q)trail.pop();else trail.push(q)}
 return{ord,trail}}
function newProgress(name){const fi=Math.random()*FORMS.length|0,{ord,trail}=scr();
 return{name,lvl:0,el:0,start:null,end:null,fi,wrong:0,
  pegs:[[4,3,2,1],[],[]],hm:0,hundo:[],ord,trail,hints:0,rs:0,msg:""}}
let last=Date.now(),paused=false,HB=false,hintTimer=null;
function resetRun(){paused=false;HB=false;clearInterval(hintTimer);hintTimer=null;sel=-1}
function startTick(){clearInterval(tick);last=Date.now();let sk=-1;tick=setInterval(()=>{const n=Date.now();let d=(n-last)/1000;last=n;
 if(!P||view!=="puzzle"||document.hidden||paused)return;if(d>2)d=.25;P.el+=d;const s=Math.floor(P.el);if(s!==sk){sk=s;if(s%5==0)save()}paintTimer()},250)}
function resync(){last=Date.now();if(!P||document.hidden)return;if(view==="puzzle"){startTick();if(HB&&!hintTimer){HB=false;render()}else paintTimer()}}
document.addEventListener("visibilitychange",()=>{if(document.hidden){if(P)save()}else resync()});
window.addEventListener("pageshow",resync);window.addEventListener("focus",resync);window.addEventListener("pagehide",()=>{if(P)save()});
function paintTimer(){const t=$("tm");if(!t)return;const left=Math.max(0,CONFIG.TIME_BUDGET_MIN*60-P.el);t.textContent=(paused?"⏸ ":"")+`${p2(Math.floor(left/60))}:${p2(Math.floor(left%60))}`;t.className="timer"+(paused?" pause":left<300?" low":"");if(left<=0&&!P.timeout){P.timeout=1;save();render()}}
const SAVED='<div class="saved">💾 進度已自動儲存，重新整理也不會消失</div>';
let slots=[],chips=[],sel=-1;
let shown="";
function render(){const a=$("app"),changed=view!==shown;shown=view;
 const paint=()=>{a.className=changed?"enter":"";a.innerHTML=({login:rLogin,brief:rBrief,puzzle:rPuzzle,gate:rGate,done:rDone})[view]();a.style.opacity=1;if(view==="puzzle"){paintTimer();applyLock()}rLB();rAdm();afterLoginFill()};
 if(changed){a.style.opacity=0;setTimeout(paint,150)}else paint()}
function rLogin(){const e=EVT;if(!chips.length){chips=shuf(CONFIG.PASS_WORDS.map((w,i)=>({w,i})));slots=[]}
 return`<h1>👻 捷而思・現在搞什麼鬼？！</h1><p style="text-align:center;color:var(--spectral)">萬聖節限定篇・主辦：${CONFIG.ORG_NAME}</p>
 <div class="card">${e?`<p class="err">${e}</p>`:""}<label>資安特派員姓名</label><input id="nm" placeholder="請輸入姓名" oninput="nmChg()" maxlength="20">
 <div id="pwb" style="display:${needPw?"block":"none"}"><label>管理員密碼</label><input id="ap" type="password"></div>
 <p>通關密語：依序點擊排出正確順序</p><div>${CONFIG.PASS_WORDS.map((_,i)=>`<span class="slot" onclick="unslot(${i})">${slots[i]!=null?chips.find(c=>c.i===slots[i]).w:"?"}</span>`).join("")}</div>
 <div>${chips.filter(c=>!slots.includes(c.i)).map(c=>`<span class="chip" onclick="pick(${c.i})">${c.w}</span>`).join("")}</div>
 <button class="btn" id="go" onclick="login()" ${slots.length===CONFIG.PASS_WORDS.length?"":"disabled"}>進入辦公室</button><div id="lerr" class="err"></div></div>`}
function pick(i){slots.push(i);keepName();render()}function unslot(i){slots.splice(i);keepName();render()}
let nmv="",apv="";function keepName(){const n=$("nm");if(n)nmv=n.value;const a=$("ap");if(a)apv=a.value}
let needPw=false,EVT="";
function nmChg(){const v=$("nm").value.trim();if(needPw&&v!==nmv){needPw=false;apv="";$("ap").value="";$("pwb").style.display="none"}nmv=v}
function afterLoginFill(){const n=$("nm");if(n){n.value=nmv;const a=$("ap");if(a)a.value=apv}}
function fetchStatus(){
 fetch(CONFIG.SCORE_URL+"?action=status&t="+Date.now()).then(r=>r.json()).then(j=>{const m=j&&j.open===false?(j.msg||""):"";if(m!==EVT){EVT=m;if(view==="login"){keepName();render()}}}).catch(()=>{})}
fetchStatus();
let authBusy=false;
async function login(){if(authBusy)return;const n=($("nm").value||"").trim();if(!n){$("lerr").textContent="請輸入姓名";return}
 const pw=$("ap")?$("ap").value:"",seq=slots.map(i=>CONFIG.PASS_WORDS[i]);
 authBusy=true;$("go").disabled=true;$("lerr").textContent="驗證中…";
 let j;try{j=await jpost({action:"login",name:n,seq,pw})}
 catch(e){authBusy=false;$("go").disabled=false;$("lerr").textContent="無法連線驗證，請稍後再試";return}
 authBusy=false;
 const fail=(m,fn)=>{keepName();if(fn)fn();render();$("lerr").textContent=m};
 if(!j||!j.ok){
  if(j&&j.needPw)return fail("這個帳號需要輸入管理員密碼",()=>{needPw=true;nmv=n});
  const R={pass:"通關密語不正確，請重新排列",pw:"管理員密碼錯誤",locked:"嘗試次數過多，請 5 分鐘後再試",name:"姓名只能使用中英文、數字、空白與 _ - . ( )"};
  if(j&&j.reason==="closed")return fail(j.msg||"活動目前未開放",()=>{EVT=j.msg||""});
  if(j&&j.reason==="pass")return fail(R.pass,()=>{slots=[]});
  if(j&&R[j.reason])return fail(R[j.reason]);
  return fail(j&&j.error?"伺服器尚未設定完成，請通知主辦單位":"驗證失敗，請稍後再試")}
 ADMIN=!!j.admin;needPw=false;$("go").disabled=false;
 notice(()=>{apv="";const u=USERS[n];u&&u.start?enter(n):knock(()=>enter(n))})}
function notice(go){if($("noticem"))return;const m=document.createElement("div");m.id="noticem";m.className="decl";
 m.innerHTML=`<div class="notice"><h3>📌 遊戲聲明與小小提醒</h3>
 <p><b>※ 遊戲聲明：</b><br>本遊戲純屬娛樂，所有情節均為虛構，請輕鬆遊玩即可！</p>
 <p><b>※ 關於開發者：</b><br>本遊戲並非專業開發，若有不足之處，請多多包涵。<br>歡迎交流，但也請手下留情，別刻意破解或破壞遊戲運作🙏</p>

 x.textAlign="center";x.fillStyle="#ff7a1a";x.font=`700 26px ${F}`;x.fillText("👻 捷而思・現在搞什麼鬼？！",W/2,m+pad+30);
 x.fillStyle="#7dffb2";x.font=`400 16px ${F}`;x.fillText(`萬聖節限定篇・主辦：${CONFIG.ORG_NAME}`,W/2,m+pad+58);
 x.textAlign="left";let y=m+pad+head;
 lay.forEach(b=>{b.lines.forEach(L=>{let px=m+pad;L.forEach(s=>{x.font=font(s);x.fillStyle=s.c;x.fillText(s.t,px,y+b.lh*.72);px+=x.measureText(s.t).width});y+=b.lh});y+=b.gap});
 return new Promise(r=>c.toBlob(r,"image/png"))}
function saveBlob(b,n){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function copyCard(b){const t0=b.textContent;b.disabled=true;
 try{if(!navigator.clipboard||!window.ClipboardItem)throw 0;await navigator.clipboard.write([new ClipboardItem({"image/png":cardPng()})]);b.textContent="✅ 已複製，直接貼上即可"}
 catch(e){try{saveBlob(await cardPng(),`通關畫面_${ME}.png`);b.textContent="⬇️ 已下載圖片"}catch(x){b.textContent="❌ 沒成功，請改用截圖"}}
 setTimeout(()=>{b.textContent=t0;b.disabled=false},2800)}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
let CLOUD=null,cloudErr="",cloudBusy=false;
async function fetchLB(){if(cloudBusy)return;cloudBusy=true;const p=P;let j=null,full=false;
 try{
  if(p&&p.end&&p.tok){try{j=await jpost({action:"board",id:p.name+"|"+p.start,tok:p.tok});full=Array.isArray(j)}catch(e){}}
  if(!full){const r=await fetch(CONFIG.SCORE_URL+(CONFIG.SCORE_URL.includes("?")?"&":"?")+"t="+Date.now());j=await r.json()}
  if(full&&P!==p){cloudBusy=false;CLOUD=null;rLB();return fetchLB()}
  CLOUD=Array.isArray(j)?j:[];cloudErr=""}
 catch(e){cloudErr="無法連線到雲端排行榜"}
 cloudBusy=false;rLB();if(view==="done")render()}
let sending=false;
function submitScore(){if(!P||!P.end||P.tok||ADMIN||sending)return;const p=P;sending=true;
 jpost(Object.assign({id:p.name+"|"+p.start,name:p.name,sec:Math.round(p.el),shots:p.shots|0,start:p.start,end:p.end},lvlStats(p)))
  .then(j=>{sending=false;if(j&&j.ok&&j.tok){p.tok=j.tok;USERS[p.name]=p;sv("hw_users",USERS);fetchLB()}}).catch(()=>{sending=false})}
fetchLB();setInterval(()=>{if(!document.hidden)fetchLB()},30000);
function rLB(){const L=(CLOUD||[]).slice(0,10),
 empty=CLOUD===null?(cloudErr?`<p class="err">${cloudErr}</p>`:"<p>載入中…</p>"):"<p>尚無通關紀錄</p>";
 $("lb").innerHTML=`<div class="card"><h3>🏆 排行榜（全公司） <button class="btn sm alt" onclick="fetchLB()">🔄 更新</button></h3>${L.length?`<table>${L.map((r,i)=>`<tr class="${["gold","silver","bronze"][i]||""}"><td>${["👑冠軍","🥈亞軍","🥉季軍"][i]||i+1}</td><td>${esc(r.name)}${lbSub(r)}</td><td class="mono">${mmss(r.sec)}</td></tr>`).join("")}</table>`:empty}${cloudErr&&CLOUD?`<p class="err" style="font-size:.8rem">${cloudErr}</p>`:""}</div>`}
function rAdm(){const a=$("adm");if(!ADMIN){a.innerHTML="";return}
 const names=Object.keys(USERS);
 a.innerHTML=`<div class="card" style="border-color:var(--venom)"><h3>🛠 測試後台</h3>
 <p style="font-size:.85rem">新增測試帳號並以該帳號登入遊玩，確認流程正常；可跳關、重設、刪除試玩紀錄。</p>
 <input id="tn" placeholder="測試帳號名稱"><button class="btn sm" onclick="addT()">建立並進入</button>
 <div style="overflow-x:auto"><table><tr><th>帳號</th><th>關卡</th><th>耗時</th><th>操作</th></tr>${names.map(n=>{const u=USERS[n];return`<tr><td>${n}${stars(u)}</td><td>${u.end?"完成":u.start?"第"+(u.lvl+1)+"關":"未開始"}</td><td class="mono">${mmss(u.el)}</td><td>
 <button class="btn sm" onclick="asUser('${n}')">進入</button><button class="btn sm alt" onclick="skip('${n}')">跳關</button><button class="btn sm alt" onclick="rst('${n}')">重設</button><button class="btn sm red" onclick="del('${n}')">刪除</button></td></tr>`}).join("")}</table></div>
 <button class="btn red sm" onclick="delAll()">清除全部本機試玩紀錄</button></div>`}
const asUser=n=>{const w=ADMIN;enter(n);ADMIN=w;rAdm()};
function addT(){const n=$("tn").value.trim();if(n)asUser(n)}
function skip(n){const u=USERS[n];if(!u)return;if(!u.start)u.start=Date.now();if(u.lvl<2)u.lvl++;else if(!u.end)u.end=Date.now();
 svU();if(ME===n){resetRun();P=u;view=u.end?"done":"puzzle";startTick()}render()}
function rst(n){USERS[n]=newProgress(n);svU();if(ME===n){resetRun();P=USERS[n];view="brief"}render()}
function del(n){delete USERS[n];svU();if(ME===n){resetRun();P=null;ME=null;view="login";chips=[]}render()}
function delAll(){if(!confirm("確定清除所有本機紀錄？"))return;USERS={};svU();P=null;ME=null;ADMIN=false;view="login";chips=[];render()}
render();
</script></body></html>
